[project]
name = "viangola-api"
version = "0.1.0"
description = "API da plataforma Viangola Interprovincial (FastAPI + PostgreSQL)"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.4",
    "pyjwt>=2.15.1",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
