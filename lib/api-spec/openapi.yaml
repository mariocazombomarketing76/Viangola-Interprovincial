openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API da plataforma Viangola Interprovincial
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: dashboard
  - name: trips
  - name: bookings
  - name: payments
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Registar nova conta (passageiro ou motorista)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterInput" }
      responses:
        "201":
          description: Conta criada e sessão iniciada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenOutput" }
        "409": { description: Email ou telefone já registado }
        "422": { description: Dados inválidos }
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Iniciar sessão
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Sessão iniciada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenOutput" }
        "401": { description: Credenciais inválidas ou conta desativada }
  /auth/refresh:
    post:
      operationId: refreshSession
      tags: [auth]
      summary: Renovar a sessão (rotação do refresh token)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshInput" }
      responses:
        "200":
          description: Novos tokens emitidos (o refresh token anterior é revogado)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenOutput" }
        "401": { description: "Sessão inválida, terminada ou expirada" }
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Terminar sessão (revoga o refresh token)
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogoutInput" }
      responses:
        "200":
          description: Sessão terminada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthStatus" }
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Perfil do utilizador autenticado
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Perfil
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserOutput" }
        "401": { description: Não autenticado ou token expirado }
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Obter resumo operacional
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /trips:
    get:
      operationId: listTrips
      tags: [trips]
      summary: Pesquisar viagens
      parameters:
        - name: origin
          in: query
          schema: { type: string }
        - name: destination
          in: query
          schema: { type: string }
        - name: date
          in: query
          schema: { type: string, format: date }
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Viagens
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Trip" }
    post:
      operationId: createTrip
      tags: [trips]
      summary: Criar viagem (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TripInput" }
      responses:
        "201":
          description: Viagem criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
  /trips/{tripId}:
    get:
      operationId: getTrip
      tags: [trips]
      summary: Obter viagem
      parameters:
        - $ref: "#/components/parameters/TripId"
      responses:
        "200":
          description: Viagem
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "404": { description: Não encontrado }
  /trips/{tripId}/seats:
    get:
      operationId: getTripSeats
      tags: [trips]
      summary: Obter lugares da viagem
      parameters:
        - $ref: "#/components/parameters/TripId"
      responses:
        "200":
          description: Lugares
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TripSeat" }
  /bookings:
    get:
      operationId: listBookings
      tags: [bookings]
      summary: Listar reservas (âmbito limitado pelo papel do utilizador)
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Reservas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Booking" }
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Reservar lugar (passageiro autenticado)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingInput" }
      responses:
        "201":
          description: Reserva criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
  /payments:
    get:
      operationId: listPayments
      tags: [payments]
      summary: Listar pagamentos (admin)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Pagamentos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Payment" }
  /payments/{paymentId}/confirm:
    post:
      operationId: confirmPayment
      tags: [payments]
      summary: Confirmar pagamento (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: paymentId
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Pagamento confirmado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Access token JWT (30 min) devolvido por /auth/login, /auth/register ou
        /auth/refresh. Enviar como `Authorization: Bearer <token>`.
  parameters:
    TripId:
      name: tripId
      in: path
      required: true
      schema: { type: number }
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    Dashboard:
      type: object
      required: [revenue, revenueChange, bookings, activeDrivers, completedTrips, passengers, weeklyRevenue, recentBookings]
      properties:
        revenue: { type: number }
        revenueChange: { type: number }
        bookings: { type: number }
        activeDrivers: { type: number }
        completedTrips: { type: number }
        passengers: { type: number }
        weeklyRevenue:
          type: array
          items:
            $ref: "#/components/schemas/RevenuePoint"
        recentBookings:
          type: array
          items:
            $ref: "#/components/schemas/Booking"
    RevenuePoint:
      type: object
      required: [day, amount]
      properties:
        day: { type: string }
        amount: { type: number }
    Trip:
      type: object
      required: [id, origin, destination, departureDate, departureTime, price, availableSeats, totalSeats, status, driverName, vehicleLabel]
      properties:
        id: { type: number }
        origin: { type: string }
        destination: { type: string }
        departureDate: { type: string, format: date }
        departureTime: { type: string }
        arrivalEstimate: { type: string }
        price: { type: number }
        availableSeats: { type: number }
        totalSeats: { type: number }
        status: { type: string }
        distance: { type: number }
        duration: { type: number }
        driverName: { type: string }
        vehicleLabel: { type: string }
    TripInput:
      type: object
      required: [origin, destination, departureDate, departureTime, price, totalSeats]
      properties:
        origin: { type: string, minLength: 2 }
        destination: { type: string, minLength: 2 }
        departureDate: { type: string, format: date }
        departureTime: { type: string }
        price: { type: number, minimum: 0 }
        totalSeats: { type: number, minimum: 1 }
    TripSeat:
      type: object
      required: [id, tripId, seatNumber, seatStatus]
      properties:
        id: { type: number }
        tripId: { type: number }
        seatNumber: { type: string }
        seatStatus: { type: string }
        passengerName: { type: ["string", "null"] }
    Booking:
      type: object
      required: [id, tripId, passengerName, origin, destination, seatNumber, amount, status, bookingDate]
      properties:
        id: { type: number }
        tripId: { type: number }
        passengerName: { type: string }
        origin: { type: string }
        destination: { type: string }
        seatNumber: { type: string }
        amount: { type: number }
        status: { type: string }
        bookingDate: { type: string, format: date-time }
    BookingInput:
      type: object
      required: [tripId, passengerName, seatNumber]
      properties:
        tripId: { type: number }
        passengerName: { type: string, minLength: 2 }
        seatNumber: { type: string }
    Payment:
      type: object
      required: [id, bookingId, referenceNumber, paymentMethod, amount, status, createdAt, passengerName]
      properties:
        id: { type: number }
        bookingId: { type: number }
        referenceNumber: { type: string }
        paymentMethod: { type: string }
        amount: { type: number }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        passengerName: { type: string }
    RegisterInput:
      type: object
      required: [fullName, email, password]
      properties:
        fullName: { type: string, minLength: 2, maxLength: 160 }
        # Nota: `format: email` é omitedo de propósito — o gerador zod do Orval
        # emite `z.email()` (API zod v4) e este workspace usa zod v3. A validação
        # de email acontece no servidor (Pydantic EmailStr) e aparece em /docs.
        email: { type: string, description: Email único (validado no servidor) }
        password: { type: string, minLength: 8, description: Mínimo de 8 caracteres (guardada apenas como hash bcrypt) }
        phone: { type: string, maxLength: 40, description: Telefone único }
        role:
          type: string
          enum: [passenger, driver]
          default: passenger
          description: "O registo de admin não é auto-registável"
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, description: Email da conta }
        password: { type: string }
    RefreshInput:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    LogoutInput:
      type: object
      properties:
        refreshToken: { type: string, description: Opcional — revoga a sessão apresentada }
    UserOutput:
      type: object
      required: [id, fullName, email, phone, role, isActive, createdAt, lastLogin]
      properties:
        id: { type: number }
        fullName: { type: string }
        email: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        role: { type: string, enum: [admin, driver, passenger] }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastLogin: { type: [string, "null"], format: date-time }
    TokenOutput:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn, user]
      properties:
        accessToken: { type: string, description: JWT de acesso (30 min) }
        refreshToken: { type: string, description: JWT de refresh (14 dias, rotativo) }
        tokenType: { type: string, enum: [bearer] }
        expiresIn: { type: number, description: Validade do access token em segundos }
        user: { $ref: "#/components/schemas/UserOutput" }
    AuthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }